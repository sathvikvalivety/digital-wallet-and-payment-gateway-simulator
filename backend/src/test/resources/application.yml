server:
  port: 0

spring:
  application:
    name: dwpg-simulator-test
  datasource:
    url: jdbc:h2:mem:dwpg_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 30
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: dwpg_super_secure_test_hmac_sha256_secret_key_minimum_32_bytes_length!
  expiration-ms: 3600000
