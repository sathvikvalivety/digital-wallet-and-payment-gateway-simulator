ext x="260" y="230">• Build tools and source code discarded</text></g></g></g><g data-cell-id="stg2"><g transform="translate(0.5,0.5)"><rect x="600" y="70" width="480" height="220" rx="33" ry="33" fill="#d1fae5" stroke="#059669" pointer-events="all" style="fill: light-dark(rgb(209, 250, 229), rgb(4, 39, 21)); stroke: light-dark(rgb(5, 150, 105), rgb(42, 167, 128));"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="840" y="132.5">STAGE 2: HARDENED PRODUCTION RUNTIME</text><text x="840" y="158.5">• Base Image: eclipse-temurin:21-jre-alpine</text><text x="840" y="171.5">• Attack Surface: Minimal (Zero package managers/compilers)</text><text x="840" y="184.5">• Minimal Size: ~180MB footprint</text><text x="840" y="197.5">• Non-Root Execution: User UID 10001 (dwpgapp)</text><text x="840" y="210.5">• Read-Only Root Filesystem: read_only: true</text><text x="840" y="223.5">• Linux Capabilities Dropped: cap_drop: ALL</text><text x="840" y="236.5">• Exposed Port: 8080 (unprivileged)</text></g></g></g><g data-cell-id="ed_stg"><g transform="translate(0.5,0.5)"><path d="M 500 180 L 589.9 180" fill="none" stroke="#059669" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(5, 150, 105), rgb(42, 167, 128));"/><path d="M 596.65 180 L 587.65 184.5 L 589.9 180 L 587.65 175.5 Z" fill="#059669" stroke="#059669" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(5, 150, 105), rgb(42, 167, 128)); stroke: light-dark(rgb(5, 150, 105), rgb(42, 167, 128));"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><rect fill="#ffffff" stroke="none" x="452" y="174" width="197" height="14" stroke-width="0" style="fill: var(--ge-adaptive-bg, #ffffff);"/><text x="550" y="184.5">COPY --from=builder dwpg-